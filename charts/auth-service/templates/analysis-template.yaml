{{- if .Values.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "auth-service.fullname" . }}-analysis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auth-service.labels" . | nindent 4 }}
spec:
  metrics:
    - name: k6-load-test
      # Un solo análisis por paso del canary; el Job corre ~45s
      interval: 1m
      count: 1
      # El Job expone un JSON con {passes, fails, p95}. Solo pasa si:
      #   - passes >= 95 (los checks pasaron)
      #   - fails <= 5    (menos de 5% fallidos)
      successCondition: result.passes >= 95 && result.fails <= 5
      failureLimit: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              metadata:
                labels:
                  app: k6-analysis
              spec:
                restartPolicy: Never
                containers:
                  - name: k6
                    image: grafana/k6:0.54.0
                    command:
                      - sh
                      - -c
                      - |
                        k6 run \
                          --summary-export=/tmp/summary.json \
                          --quiet \
                          /scripts/load-test.js || true;
                        # Convertimos el summary de k6 a un JSON mínimo
                        # que Argo Rollouts pueda evaluar con successCondition.
                        apk add --no-cache jq >/dev/null 2>&1 || true;
                        PASSES=$(jq '[.metrics.checks.values // {} | to_entries[] | .value] | add // 0' /tmp/summary.json 2>/dev/null || echo 0);
                        FAILS=$(jq '[.metrics.checks.values // {} | to_entries[] | .value] | add // 0' /tmp/summary.json 2>/dev/null || echo 0);
                        # Si k6 no produjo summary, marcamos fallo total
                        if [ ! -f /tmp/summary.json ]; then PASSES=0; FAILS=999; fi;
                        # Extraemos el check real desde el summary de k6
                        # k6 pone "checks" como métrica con sub-keys passes/fails
                        if [ -f /tmp/summary.json ]; then
                          PASSES=$(jq '.metrics.checks.passes // 0' /tmp/summary.json);
                          FAILS=$(jq '.metrics.checks.fails // 0' /tmp/summary.json);
                        fi
                        echo "{\"passes\": $PASSES, \"fails\": $FAILS}" > /tmp/result.json;
                        cat /tmp/result.json
                    env:
                      - name: BASE_URL
                        value: "{{ .Values.analysis.serviceUrl }}"
                    volumeMounts:
                      - name: k6-script
                        mountPath: /scripts
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        cpu: 500m
                        memory: 256Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                volumes:
                  - name: k6-script
                    configMap:
                      name: {{ include "auth-service.fullname" . }}-k6-script
{{- end }}