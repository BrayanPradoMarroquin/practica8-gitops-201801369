{{- if .Values.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "auth-service.fullname" . }}-analysis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auth-service.labels" . | nindent 4 }}
spec:
  metrics:
    - name: k6-load-test
      interval: 1m
      count: 1
      successCondition: result.passes >= 95 && result.fails <= 5
      failureLimit: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              metadata:
                labels:
                  app: k6-analysis
              spec:
                restartPolicy: Never
                # ✅ SecurityContext A NIVEL POD (obligatorio por Kyverno)
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  fsGroup: 1000
                containers:
                  - name: k6
                    image: grafana/k6:0.54.0
                    command:
                      - sh
                      - -c
                      - |
                        k6 run --summary-export=/tmp/summary.json --quiet /scripts/load-test.js || true
                        PASSES=$(grep -o '"passes":[0-9]*' /tmp/summary.json | head -1 | grep -o '[0-9]*' || echo 0)
                        FAILS=$(grep -o '"fails":[0-9]*' /tmp/summary.json | head -1 | grep -o '[0-9]*' || echo 999)
                        echo "{\"passes\": $PASSES, \"fails\": $FAILS}"
                        if [ "$PASSES" -lt 95 ] || [ "$FAILS" -gt 5 ]; then exit 1; fi
                    env:
                      - name: BASE_URL
                        value: "{{ .Values.analysis.serviceUrl }}"
                    volumeMounts:
                      - name: k6-script
                        mountPath: /scripts
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        cpu: 500m
                        memory: 256Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                volumes:
                  - name: k6-script
                    configMap:
                      name: {{ include "auth-service.fullname" . }}-k6-script
{{- end }}