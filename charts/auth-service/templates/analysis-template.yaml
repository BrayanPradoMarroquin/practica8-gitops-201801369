apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: auth-service-smoke-test
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  args:
    - name: service-name
    - name: namespace
      value: {{ .Release.Namespace }}
  metrics:
    - name: smoke-test
      interval: 15s
      count: 3
      failureLimit: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:latest
                    command:
                      - sh
                      - -c
                      - |
                        curl -sf http://{{ `{{ args.service-name }}` }}.{{ `{{ args.namespace }}` }}.svc.cluster.local:3001/health | grep -q '"status":"OK"'
    - name: latency-test
      interval: 30s
      count: 2
      failureLimit: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: k6
                    image: grafana/k6:latest
                    command:
                      - sh
                      - -c
                      - |
                        cat <<'EOF' > /tmp/test.js
                        import http from 'k6/http';
                        import { check } from 'k6';
                        export const options = {
                          vus: 5,
                          duration: '20s',
                          thresholds: {
                            http_req_duration: ['p(95)<500'],
                            http_req_failed: ['rate<0.01'],
                          },
                        };
                        export default function () {
                          const r = http.get('http://{{ `{{ args.service-name }}` }}.{{ `{{ args.namespace }}` }}.svc.cluster.local:3001/health');
                          check(r, { 'ok': (res) => res.status === 200 });
                        }
                        EOF
                        k6 run /tmp/test.js