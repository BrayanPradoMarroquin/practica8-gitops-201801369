{{- if .Values.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "auth-service.fullname" . }}-analysis
  namespace: {{ .Release.Namespace }}
spec:
  metrics:
    - name: health-check
      interval: {{ .Values.analysis.interval }}
      successCondition: result == "OK"
      failureLimit: {{ .Values.analysis.failureThreshold }}
      provider:
        web:
          url: "{{ .Values.analysis.serviceUrl }}/health"
          timeoutSeconds: 10
          jsonPath: "{$.status}"
{{- end }}