apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: auth-service-smoke-test
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  args:
    - name: service-name
  metrics:
    - name: smoke-test
      interval: 10s
      count: 3
      failureLimit: 1
      provider:
        web:
          url: "http://{{ `{{ args.service-name }}` }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}/health"
          timeoutSeconds: 5
          jsonPath: "{$.status}"
          successCondition: "result == 'OK'"