replicaCount: 1

image:
  repository: brayanprado09/practica7-microservicios-auth
  tag: "v1.0.9-1bcfe03"    # ajusta al último tag firmado
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 3001

env:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: authdb
  DB_USER: authuser

existingSecret: postgres-secret

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: 3001
  initialDelaySeconds: 15
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: 3001
  initialDelaySeconds: 10
  periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

rollout:
  enabled: true
  strategy: canary
  steps:
    - setCanaryScale:
        replicas: 1
    - pause: { duration: 30s }
    - setWeight: 20
    - pause: { duration: 60s }
    - setWeight: 50
    - pause: { duration: 60s }
    - setWeight: 100

analysis:
  enabled: true
  interval: 60s
  successThreshold: 1
  failureThreshold: 1
  serviceUrl: http://auth-service.microservices.svc.cluster.local:3001

# Umbrales justificados (documentar en el README)
thresholds:
  maxErrorRate: 0.05
  p95LatencyMs: 500
  p99LatencyMs: 1000