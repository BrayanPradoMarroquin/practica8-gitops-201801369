replicaCount: 1

image:
  repository: brayanprado09/practica7-microservicios-auth
  tag: "latest"          # ⚠️ Cambiar en la iteración 5 por una versión semántica
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 3001

# Variables de entorno (conexión a Postgres)
env:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: authdb
  DB_USER: authuser
  # DB_PASSWORD viene desde un Secret

existingSecret: postgres-secret

# Recursos
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Probes
livenessProbe:
  httpGet:
    path: /health
    port: 3001
  initialDelaySeconds: 15
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: 3001
  initialDelaySeconds: 10
  periodSeconds: 10

# Contexto de seguridad (obligatorio por Kyverno)
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Argo Rollouts - canary con 3 pasos
rollout:
  enabled: true
  strategy: canary
  steps:
    - setWeight: 20
    - pause: { duration: 30s }
    - setWeight: 50
    - pause: { duration: 30s }
    - setWeight: 100

# AnalysisTemplate - umbrales para promoción/reversión
analysis:
  enabled: true
  interval: 30s
  successThreshold: 3
  failureThreshold: 2
  serviceUrl: http://auth-service.microservices.svc.cluster.local:3001