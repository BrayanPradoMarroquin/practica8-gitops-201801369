replicaCount: 2

image:
  repository: docker.io/brayanprado09/practica7-microservicios-auth
  tag: "1.0.1"       # Semver, nunca latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3001

env:
  DB_HOST: "postgresql"
  DB_USER: "admin"
  DB_NAME: "authdb"
  PORT: "3001"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

probes:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}