replicaCount: 2

image:
  repository: docker.io/brayanprado09/practica7-microservicios-gateway
  tag: "1.0.1"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8080

env:
  AUTH_SERVICE_URL: "http://auth-service-sa-p8:3001"
  BOOKS_SERVICE_URL: "http://books-service-sa-p8:3002"
  ORDERS_SERVICE_URL: "http://orders-service-sa-p8:3003"
  INVENTORY_SERVICE_URL: "http://inventory-service-sa-p8:3004"
  PORT: "8080"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

probes:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}