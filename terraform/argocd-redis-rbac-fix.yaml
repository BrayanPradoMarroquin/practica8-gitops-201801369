apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-redis-secret-init-role
  namespace: argocd
rules:
- apiGroups: [""]
  resourceNames: ["argocd-redis"]
  resources: ["secrets"]
  verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-redis-secret-init-binding
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-redis-secret-init-role
subjects:
- kind: ServiceAccount
  name: argocd-redis-secret-init # <-- El ServiceAccount correcto
  namespace: argocd