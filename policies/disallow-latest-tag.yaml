apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Prohibir etiqueta latest
    policies.kyverno.io/description: >-
      Todas las imágenes deben usar una etiqueta semántica (ej. 1.0.0).
      El uso de "latest" queda prohibido para garantizar trazabilidad.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - argocd
                - kyverno
                - argo-rollouts
      validate:
        message: "No se permite el uso de la etiqueta 'latest' en las imágenes. Usa una versión semántica (ej. 1.0.0)."
        pattern:
          spec:
            containers:
              - image: "!*:latest"