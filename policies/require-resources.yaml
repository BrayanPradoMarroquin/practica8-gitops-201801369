apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resources
  annotations:
    policies.kyverno.io/title: Exigir límites de CPU y memoria
    policies.kyverno.io/description: >-
      Todos los contenedores deben declarar límites de CPU y memoria
      para evitar que un pod consuma todos los recursos del nodo.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: validate-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - argocd
                - kyverno
                - argo-rollouts
      validate:
        message: "Todos los contenedores deben declarar límites de CPU y memoria."
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    memory: "?*"
                    cpu: "?*"
                  requests:
                    memory: "?*"
                    cpu: "?*"